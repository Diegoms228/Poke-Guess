{% extends 'base.html' %}

{% block contenido %}
    <h1 class="title">Poke-Guess</h1>
    <p class="subtitle">Crear cuenta</p>

    <form class="formulario" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if error %}<p class="error">{{ error }}</p>{% endif %}

        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" value="{{ username or '' }}"
               maxlength="20" autocomplete="username" required autofocus>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email or '' }}"
               maxlength="120" autocomplete="email" required>

        <label for="password">Contraseña (mínimo 8 caracteres)</label>
        <input id="password" name="password" type="password" minlength="8"
               autocomplete="new-password" required>

        <button class="btn" type="submit">▶ Crear cuenta</button>
    </form>

    <p class="subtitle">¿Ya tienes cuenta? <a class="enlace" href="{{ url_for('login') }}">Inicia sesión</a></p>
    <a class="btn btn-secundario" href="{{ url_for('menu') }}">◀ Volver al menú</a>
{% endblock %}
