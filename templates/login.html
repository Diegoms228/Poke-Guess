{% extends 'base.html' %}

{% block contenido %}
    <h1 class="title">Poke-Guess</h1>
    <p class="subtitle">Iniciar sesión</p>

    <form class="formulario" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% if error %}<p class="error">{{ error }}</p>{% endif %}

        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" value="{{ username or '' }}"
               maxlength="20" autocomplete="username" required autofocus>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <button class="btn" type="submit">▶ Entrar</button>
    </form>

    <p class="subtitle">¿No tienes cuenta? <a class="enlace" href="{{ url_for('registro') }}">Créala aquí</a></p>
    <a class="btn btn-secundario" href="{{ url_for('menu') }}">◀ Volver al menú</a>
{% endblock %}
