{% extends 'base.html' %}

{% block contenido %}
    <h1 class="title">Poke-Guess</h1>

    <p class="subtitle">Cada uno en su móvil:</p>
    <a class="btn" href="{{ url_for('online') }}">▶ Jugar online</a>

    <p class="subtitle">Todos en este móvil:</p>
    <div class="fila">
        {% for n in [2, 3, 4, 5] %}
            <a class="btn" href="{{ url_for('jugar', jugadores=n) }}">▶ {{ n }}</a>
        {% endfor %}
    </div>
    <p class="nota">El progreso y el ranking solo cuentan en las partidas online.</p>

    <a class="btn btn-secundario" href="{{ url_for('menu') }}">◀ Volver al menú</a>
{% endblock %}
